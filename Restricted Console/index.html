<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Restricted Console | The Quiet End</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=B612+Mono:wght@400;700&family=Share+Tech+Mono&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        color-scheme: dark;
        --ink: #ffb3b3;
        --muted: #b37a7a;
        --line: rgba(255, 110, 110, 0.4);
        --glow: rgba(255, 90, 90, 0.35);
        --panel: rgba(12, 4, 4, 0.96);
        --radius: 3px;
        --font-title: "B612 Mono", "Courier New", monospace;
        --font-body: "Share Tech Mono", "Courier New", monospace;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: var(--font-body);
        color: var(--ink);
        background:
          radial-gradient(circle at top, rgba(255, 90, 90, 0.15), transparent 55%),
          linear-gradient(180deg, #040101 0%, #0b0303 48%, #030101 100%);
        display: grid;
        grid-template-rows: auto 1fr;
        align-items: start;
        padding: 32px 6vw;
        text-shadow: 0 0 10px rgba(255, 90, 90, 0.3), 1px 0 0 rgba(255, 90, 90, 0.12);
        position: relative;
        overflow-x: hidden;
      }

      body::before {
        content: "";
        position: fixed;
        inset: 0;
        background-image:
          linear-gradient(transparent 96%, rgba(255, 100, 100, 0.05) 100%),
          linear-gradient(90deg, transparent 96%, rgba(255, 100, 100, 0.05) 100%);
        background-size: 52px 52px;
        opacity: 0.4;
        pointer-events: none;
      }

      body.glitch {
        animation: flicker 0.35s steps(2, end);
      }

      body.glitch::before {
        animation: scanJitter 0.35s steps(2, end);
      }

      header {
        width: min(520px, 86vw);
        align-self: center;
        justify-self: center;
        margin-bottom: 18px;
      }

      .eyebrow {
        margin: 0;
        font-size: 0.7rem;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: var(--muted);
      }

      .eyebrow a {
        color: var(--ink);
        text-decoration: none;
        border-bottom: 1px solid rgba(255, 120, 120, 0.4);
        padding-bottom: 2px;
      }

      .eyebrow a:hover {
        color: #ffd1d1;
        border-bottom-color: rgba(255, 180, 180, 0.7);
      }

      main {
        width: min(520px, 86vw);
        border: 1px solid var(--line);
        border-radius: var(--radius);
        padding: 26px 24px 30px;
        background: var(--panel);
        box-shadow: 0 0 24px rgba(255, 80, 80, 0.15);
        display: grid;
        gap: 18px;
        position: relative;
        z-index: 1;
        align-self: center;
        justify-self: center;
      }

      h1 {
        margin: 0;
        font-family: var(--font-title);
        font-size: clamp(1.4rem, 3vw, 2rem);
        letter-spacing: 0.28em;
        text-transform: uppercase;
      }

      form {
        display: grid;
        gap: 14px;
      }

      input {
        font-family: var(--font-body);
        font-size: 1rem;
        padding: 12px 14px;
        border-radius: var(--radius);
        border: 1px solid rgba(255, 110, 110, 0.6);
        background: rgba(4, 2, 2, 0.9);
        color: var(--ink);
        text-transform: uppercase;
        letter-spacing: 0.18em;
        box-shadow: inset 0 0 18px rgba(255, 90, 90, 0.15);
        -webkit-text-security: square;
      }

      input:focus {
        outline: none;
        border-color: rgba(255, 140, 140, 0.9);
        box-shadow: 0 0 12px var(--glow);
      }

      button {
        font-family: var(--font-body);
        font-size: 0.9rem;
        text-transform: uppercase;
        letter-spacing: 0.22em;
        padding: 10px 16px;
        border-radius: var(--radius);
        border: 1px solid rgba(255, 110, 110, 0.65);
        background: rgba(20, 6, 6, 0.9);
        color: var(--ink);
        cursor: pointer;
        box-shadow: inset 0 0 12px rgba(255, 90, 90, 0.2);
        justify-self: center;
      }

      button:hover {
        border-color: rgba(255, 140, 140, 0.9);
      }

      .denied {
        font-family: var(--font-title);
        font-size: 0.85rem;
        letter-spacing: 0.24em;
        text-transform: uppercase;
        color: var(--ink);
        display: none;
      }

      .denied.active {
        display: block;
      }

      @keyframes flicker {
        0% {
          filter: brightness(1) saturate(1);
          transform: translateX(0);
        }
        40% {
          filter: brightness(1.35) saturate(1.3);
          transform: translateX(-2px);
        }
        70% {
          filter: brightness(0.8) saturate(0.9);
          transform: translateX(2px);
        }
        100% {
          filter: brightness(1) saturate(1);
          transform: translateX(0);
        }
      }

      @keyframes scanJitter {
        0% {
          opacity: 0.35;
          transform: translateY(0);
        }
        50% {
          opacity: 0.7;
          transform: translateY(-4px);
        }
        100% {
          opacity: 0.35;
          transform: translateY(0);
        }
      }
    </style>
  </head>
  <body>
    <header>
      <p class="eyebrow"><a href="../index.html">Homepage</a> // Restricted Console</p>
    </header>
    <main>
      <h1>ACCESS CODE</h1>
      <form autocomplete="off">
        <input type="password" name="access" autocomplete="off" aria-label="Access code entry" />
        <div class="denied" id="access-denied">ACCESS DENIED</div>
        <button type="submit">LOGIN</button>
      </form>
    </main>

    <script>
      const form = document.querySelector("form");
      const input = document.querySelector("input");
      const denied = document.getElementById("access-denied");
      const body = document.body;

      form.addEventListener("submit", (event) => {
        event.preventDefault();
        denied.classList.add("active");
        form.reset();
        body.classList.remove("glitch");
        void body.offsetWidth;
        body.classList.add("glitch");
      });
    </script>
  </body>
</html>
