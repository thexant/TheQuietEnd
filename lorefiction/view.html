<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Redirecting...</title>
    <script>
      const params = new URLSearchParams(window.location.search);
      const doc = params.get("doc");
      const target = doc ? `view.php?doc=${encodeURIComponent(doc)}` : "view.php";
      window.location.href = target;
    </script>
  </head>
  <body>
    <p>Redirecting to <a href="view.php">view.php</a>...</p>
  </body>
</html>
